[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "terramask"
dynamic = ["version"]
description = "Masks, outlines, polygons and distance grids of water, land, forests, parks or any OpenStreetMap layer, for any area, from vector tiles fetched on demand; depth and height bands from terrain tiles"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["gis", "openstreetmap", "coastline", "water", "land", "forest", "elevation", "bathymetry", "vector-tiles", "raster"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/piLeoni/terramask"

[tool.maturin]
manifest-path = "crates/terramask-py/Cargo.toml"
python-source = "python"
module-name = "terramask._terramask"
include = [{ path = "LICENSE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
