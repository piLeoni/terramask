[workspace]
members = [
  "crates/terramask",
  "crates/terramask-py",
  "crates/terramask-node",
  "crates/terramask-wasm",
]
# py / node / wasm are built by maturin / napi / wasm-pack, not a plain cargo build.
default-members = ["crates/terramask"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/piLeoni/terramask"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
