[package]
name = "terramask"
description = "Masks, outlines, polygons and distance grids of water, land, forests, parks or any OpenStreetMap layer, for any area, from vector tiles fetched on demand; depth and height bands from terrain tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["gis", "openstreetmap", "vector-tiles", "elevation", "raster"]
categories = ["science::geo", "graphics"]

[features]
default = ["fetch", "dem"]
# Download and cache tiles over HTTP. Off for WebAssembly, where the page fetches.
fetch = ["dep:ureq"]
# Elevation from terrain tiles (Terrarium PNG), to cut areas into depth or height bands.
dem = ["dep:png"]

[dependencies]
flate2 = "1"
i_overlay = "9"
png = { version = "0.17", optional = true }
ureq = { version = "2", optional = true }

[dev-dependencies]
png = "0.17"
flate2 = "1"
tiny-skia = "0.11"
