[package]
name = "terramask-wasm"
description = "WebAssembly bindings for terramask: masks, polygons and elevation bands from OpenStreetMap and terrain tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
terramask = { path = "../terramask", default-features = false, features = ["dem"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O"]
