[package]
name = "watermask-py"
description = "Python bindings for watermask"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_watermask"
crate-type = ["cdylib"]

[dependencies]
watermask = { path = "../watermask" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
