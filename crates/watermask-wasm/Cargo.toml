[package]
name = "watermask-wasm"
description = "WebAssembly bindings for watermask: water masks from OpenStreetMap vector tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
watermask = { path = "../watermask", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O"]
